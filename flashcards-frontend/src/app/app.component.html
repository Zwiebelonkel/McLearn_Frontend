<app-toast></app-toast>
<div class="page-container">
  <div class="main-content">
    <header class="header">
      <div class="container">
        <button class="brand" type="button" aria-label="Zur Startseite" (click)="goHome()">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H11v15H7.5A2.5 2.5 0 0 0 5 20.5v-15Z" />
              <path d="M19 5.5A2.5 2.5 0 0 0 16.5 3H13v15h3.5a2.5 2.5 0 0 1 2.5 2.5v-15Z" />
            </svg>
          </span>
          <span class="brand-copy">
            <h1 class="title">McLearn</h1>
            <span class="brand-tagline">Lernen. Merken. Meistern.</span>
          </span>
        </button>
        <button
          #toggleButton
          class="sidebar-toggle"
          type="button"
          aria-label="Menü öffnen"
          [attr.aria-expanded]="isSidebarOpen"
          (click)="toggleSidebar($event)">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main class="main">
      <router-outlet></router-outlet>
    </main>
    <footer class="footer">
      <p>&copy; 2026 McLearn</p>
    </footer>
  </div>
  <app-sidebar
  #sidebar
  [class.open]="isSidebarOpen"
  (closed)="isSidebarOpen = false">
</app-sidebar>
</div>
